services:
  worker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_worker
    ports:
      - "5434:5432"
    volumes:
      - worker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_worker"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  ecommerce-worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__WorkerDatabase: Host=worker-db;Port=5432;Database=ecommerce_worker;Username=postgres;Password=postgres
      WorkerRuntime__ShutdownDrainSeconds: 30
      WorkerRuntime__ConsumerConcurrency: 1
      WorkerRuntime__DatabasePoolSize: 32
      WorkerRuntime__DatabaseCommandTimeoutSeconds: 30
      WorkerRuntime__RabbitMqConnectionTimeoutSeconds: 10
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: ecommerce.events
      RabbitMq__QueueName: ecommerce.worker.orders
      RabbitMq__RetryExchangeName: ecommerce.events.retry
      RabbitMq__RetryQueueName: ecommerce.worker.orders.retry
      RabbitMq__DeadLetterExchangeName: ecommerce.events.dlx
      RabbitMq__DeadLetterQueueName: ecommerce.worker.orders.dead
      RabbitMq__MaximumRetryAttempts: 3
      RabbitMq__RetryDelaySeconds: 15
      Email__Enabled: "false"
    ports:
      - "8082:8080"
    depends_on:
      worker-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  worker-postgres-data:
